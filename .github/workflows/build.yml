name: R2R-ZX Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  vst3:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk libfreetype6-dev libx11-dev libxinerama-dev libxrandr-dev libxcursor-dev libgl1-mesa-dev libwebkit2gtk-4.1-dev libgtk-3-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build VST3 and Standalone
        run: cmake --build build --config Release --parallel 2
