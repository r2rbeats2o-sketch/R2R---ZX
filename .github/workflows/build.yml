name: R2R-ZX Windows VST3 Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  vst3:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure x64
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build VST3
        run: cmake --build build --config Release --target R2R_ZX_VST3 --parallel
      - name: Verify VST3 bundle
        shell: pwsh
        run: |
          $plugin = "build/R2R_ZX_artefacts/Release/VST3/R2R-ZX.vst3"
          if (!(Test-Path $plugin)) {
            Write-Error "VST3 bundle not found at $plugin"
          }
          Get-ChildItem $plugin -Recurse | Select-Object FullName
      - name: Upload Windows VST3
        uses: actions/upload-artifact@v4
        with:
          name: R2R-ZX-Windows-x64-VST3
          path: build/R2R_ZX_artefacts/Release/VST3/R2R-ZX.vst3
          if-no-files-found: error
